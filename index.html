<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Stencil</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24283b;
    --border: #3b4261;
    --fg: #c0caf5;
    --muted: #787fa6;
    --accent: #e0af68;
    --ok: #9ece6a;
    --err: #f7768e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); font-size: 14px;
  }
  #sidebar {
    width: 330px; min-width: 330px; padding: 16px; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 14px;
  }
  #header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 16px; margin: 0; }
  h1 small { color: var(--muted); font-weight: normal; }
  #lang { width: auto; padding: 3px 6px; }
  #drop {
    border: 2px dashed var(--border); border-radius: 8px; padding: 18px 12px;
    text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s;
  }
  #drop.over, #drop:hover { border-color: var(--accent); color: var(--fg); }
  #drop b { color: var(--accent); }
  fieldset {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 8px; margin: 0;
  }
  legend { color: var(--muted); padding: 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  label.row span { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: baseline; }
  input[type=number] {
    width: 76px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--fg); font: inherit; text-align: right;
  }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  select {
    width: 90px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  select:focus { outline: none; border-color: var(--accent); }
  input[type=range] { accent-color: var(--accent); }
  label.radio { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label.radio input { accent-color: var(--accent); }
  label.radio.disabled { color: var(--muted); cursor: not-allowed; }
  #preview2d { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  #info { color: var(--muted); font-size: 12px; line-height: 1.6; white-space: pre-line; }
  #status { font-size: 12px; min-height: 16px; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  button {
    padding: 10px; border: none; border-radius: 8px; background: var(--accent);
    color: #1a1b26; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #viewport { flex: 1; position: relative; }
  #viewport canvas { display: block; }
  #hint3d {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); pointer-events: none; font-size: 15px;
  }
  #look {
    position: absolute; top: 12px; left: 12px; width: 250px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #lookToggle {
    align-self: flex-start; padding: 6px 12px; border: 1px solid var(--border);
    background: rgba(36, 40, 59, .92); color: var(--fg); font-weight: 500;
  }
  #lookToggle.on { background: var(--accent); border-color: var(--accent); color: #1a1b26; }
  #lookBody {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: rgba(36, 40, 59, .92); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 8px;
  }
  #lookBody[hidden] { display: none; }
  #lookBody select { width: 130px; }
  input[type=color] {
    width: 44px; height: 26px; padding: 0 2px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--bg); cursor: pointer;
  }
  .swatches { display: flex; gap: 6px; justify-content: flex-end; }
  .swatches button {
    width: 22px; height: 22px; padding: 0; border-radius: 50%;
    border: 2px solid var(--border);
  }
  .swatches button.active { border-color: var(--accent); }
</style>
</head>
<body>
  <div id="sidebar">
    <div id="header">
      <h1>Coffee Stencil <small data-i18n="app.subtitle">— latte art stencil generator</small></h1>
      <select id="lang" aria-label="Language">
        <option value="cs">CZ</option>
        <option value="en">EN</option>
      </select>
    </div>

    <div id="drop">
      <b data-i18n="drop.title">Drop SVG / PNG / JPG here</b><br><span data-i18n="drop.sub">or click to choose · or paste (⌘V)</span>
      <input type="file" id="file" accept=".svg,.png,.jpg,.jpeg,.webp,image/svg+xml,image/png,image/jpeg,image/webp" hidden>
    </div>

    <fieldset id="rasterFs" style="display:none">
      <legend data-i18n="raster.legend">Image vectorization</legend>
      <label class="row"><span data-i18n="raster.threshold">Brightness threshold</span>
        <input type="range" id="threshold" min="1" max="254" value="128" style="flex:2">
        <span id="thresholdVal" style="width:28px;text-align:right;color:var(--muted)">128</span>
      </label>
      <label class="radio"><input type="checkbox" id="invert"> <span data-i18n="raster.invert">invert (light shapes)</span></label>
      <label class="row"><span data-i18n="raster.simplify">Simplification</span>
        <input type="range" id="simplify" min="0.5" max="8" step="0.5" value="2" style="flex:2">
        <span id="simplifyVal" style="width:28px;text-align:right;color:var(--muted)">2</span>
      </label>
      <label class="row"><span data-i18n="raster.smooth">Smoothing (0–3)</span><input type="number" id="smooth" value="1" min="0" max="3" step="1"></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="mode.legend">Powder draws</legend>
      <label class="radio"><input type="radio" name="mode" value="positive" checked> <span data-i18n="mode.positive">the motif (cut out)</span></label>
      <label class="radio"><input type="radio" name="mode" value="negative"> <span data-i18n="mode.negative">around the motif (motif stays light)</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="size.legend">Motif (mm)</legend>
      <label class="row"><span><i class="dot" style="background:#7aa2f7"></i><span data-i18n="size.width">Motif width</span></span><input type="number" id="motifW" value="60" min="5" max="300" step="1"></label>
      <label class="row"><span><i class="dot" style="background:#73daca"></i><span data-i18n="size.height">Motif height</span></span><input type="number" id="motifH" value="60" min="5" max="300" step="1"></label>
      <label class="radio"><input type="checkbox" id="lockAspect" checked> <span data-i18n="size.lockAspect">keep aspect ratio</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="params.legend">Stencil (mm)</legend>
      <label class="row"><span data-i18n="params.preset">Cup</span>
        <select id="preset">
          <option value="espresso" data-i18n="preset.espresso">espresso</option>
          <option value="cappuccino" selected data-i18n="preset.cappuccino">cappuccino</option>
          <option value="mug" data-i18n="preset.mug">large mug</option>
          <option value="custom" data-i18n="preset.custom">custom</option>
        </select>
      </label>
      <label class="row"><span><i class="dot" style="background:#bb9af7"></i><span data-i18n="params.plateD">Plate diameter</span></span><input type="number" id="plateD" value="110" min="30" max="300" step="1"></label>
      <label class="row" id="windowRow"><span><i class="dot" style="background:#ff9e64"></i><span data-i18n="params.windowD">Dusting window</span></span><input type="number" id="windowD" value="80" min="10" max="300" step="1"></label>
      <label class="row"><span><i class="dot" style="background:#e0af68"></i><span data-i18n="params.thickness">Thickness</span></span><input type="number" id="thickness" value="1.2" min="0.4" max="5" step="0.1"></label>
      <label class="row"><span data-i18n="params.bridgeW">Bridge width</span><input type="number" id="bridgeW" value="1.5" min="0.6" max="10" step="0.1"></label>
      <label class="row"><span data-i18n="params.bridges">Bridges per island</span>
        <input type="range" id="bridges" min="0" max="6" step="1" value="0" style="flex:1.2">
        <span id="bridgesVal" style="width:28px;text-align:right;color:var(--muted)">auto</span>
      </label>
      <label class="row"><span data-i18n="params.cornerR">Corner rounding</span>
        <input type="range" id="cornerR" min="0" max="2" step="0.1" value="0.3" style="flex:1.2">
        <span id="cornerRVal" style="width:28px;text-align:right;color:var(--muted)">0.3</span>
      </label>
      <label class="row"><span><i class="dot" style="background:#9ece6a"></i><span data-i18n="params.tabLen">Handle length</span></span><input type="number" id="tabLen" value="35" min="0" max="150" step="1"></label>
      <label class="row"><span data-i18n="params.tabW">Handle width</span><input type="number" id="tabW" value="24" min="8" max="100" step="1"></label>
      <label class="row"><span data-i18n="params.holeD">Hanging hole</span><input type="number" id="holeD" value="6" min="0" max="40" step="0.5"></label>
      <label class="radio" style="border-top:1px solid var(--border); padding-top:8px; margin-top:2px">
        <input type="checkbox" id="showDims" checked> <span data-i18n="params.showDims">show dimensions</span>
      </label>
    </fieldset>

    <canvas id="preview2d" width="300" height="300"></canvas>
    <div id="info"></div>
    <div id="status"></div>
    <div style="display:flex; gap:8px">
      <button id="download" disabled style="flex:1">⬇ STL</button>
      <button id="download3mf" disabled style="flex:1">⬇ 3MF</button>
    </div>
  </div>

  <div id="viewport">
    <div id="hint3d" data-i18n="hint3d">Load a file…</div>
    <div id="look">
      <button id="lookToggle">✨ <span data-i18n="look.toggle">Viewing mode</span></button>
      <div id="lookBody" hidden>
        <label class="row"><span data-i18n="look.lighting">Lighting</span>
          <select id="lighting">
            <option value="studio" data-i18n="lighting.studio">studio</option>
            <option value="daylight" data-i18n="lighting.daylight">daylight</option>
            <option value="cafe" data-i18n="lighting.cafe">café (warm)</option>
            <option value="dramatic" data-i18n="lighting.dramatic">dramatic</option>
            <option value="top" data-i18n="lighting.top">from above</option>
          </select>
        </label>
        <label class="row"><span data-i18n="look.background">Background</span><input type="color" id="bgColor"></label>
        <div class="swatches" id="bgSwatches"></div>
        <label class="row"><span data-i18n="look.material">Material</span>
          <select id="material">
            <option value="plaMatte" data-i18n="material.plaMatte">matte PLA</option>
            <option value="plaGloss" data-i18n="material.plaGloss">glossy PLA</option>
            <option value="silk" data-i18n="material.silk">silk PLA</option>
            <option value="petg" data-i18n="material.petg">translucent PETG</option>
            <option value="steel" data-i18n="material.steel">stainless steel</option>
            <option value="brass" data-i18n="material.brass">brass</option>
            <option value="copper" data-i18n="material.copper">copper</option>
          </select>
        </label>
        <label class="row"><span data-i18n="look.color">Colour</span><input type="color" id="matColor"></label>
        <label class="row"><span data-i18n="look.surface">Surface</span>
          <select id="surface">
            <option value="smooth" data-i18n="surface.smooth">smooth</option>
            <option value="printed" data-i18n="surface.printed">print lines</option>
            <option value="blasted" data-i18n="surface.blasted">bead-blasted</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.ts"></script>
</body>
</html>
